name: Build Android APK

# MANUAL ONLY. Nothing starts unless you press Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle wrapper and debug key
        run: |
          set -e
          if [ ! -f gradlew ]; then
            VER=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' gradle/wrapper/gradle-wrapper.properties | head -1 | sed 's/gradle-//')
            if [ -z "$VER" ]; then VER="9.3.1"; fi
            gradle wrapper --gradle-version "$VER"
          fi
          chmod +x gradlew
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Is the release signing key configured?
        id: signing
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Release signing: YES"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release signing: NO - debug APK only"
          fi

      - name: Decrypt the release keystore
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -e
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          test -s release.keystore || { echo "keystore decoded to nothing"; exit 1; }
          echo "RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "Keystore ready."

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --console=plain > build.log 2>&1
          code=$?
          echo "======= KOTLIN / GRADLE ERRORS ======="
          grep -E "^e: |^w: |error:|FAILED|What went wrong" build.log | head -40
          echo "======= END OF ERRORS ======="
          exit $code

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: |
          set +e
          ./gradlew assembleRelease --console=plain > release.log 2>&1
          code=$?
          echo "======= RELEASE ERRORS ======="
          grep -E "^e: |error:|FAILED|What went wrong" release.log | head -40
          echo "======= END OF ERRORS ======="
          exit $code

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-horizon-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pulse-horizon-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
