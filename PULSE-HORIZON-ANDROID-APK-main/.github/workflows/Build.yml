name: Build android app

# Run it: Actions tab -> "Build android app" -> Run workflow.
# The APK appears at the bottom of the finished run under "Artifacts".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find the Android project folder
        id: proj
        run: |
          # Works whether the project is at the repo root or inside a sub-folder.
          F=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$F" ]; then echo "ERROR: settings.gradle.kts not found"; exit 1; fi
          DIR=$(dirname "$F")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug key
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Is the release signing key configured?
        id: key
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ENC=$(find . -path "*/.github/signing/release.keystore.enc" | head -n 1)
          if [ -n "$PW" ] && [ -n "$ENC" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "enc=$ENC" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No release key (run 'Singing key' once + add KEYSTORE_PASSWORD). Building debug only."
          fi

      - name: Decrypt the release keystore
        if: steps.key.outputs.present == 'true'
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "${{ steps.key.outputs.enc }}" \
            -out "$RUNNER_TEMP/signing/release.keystore" -pass pass:"$PW"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set +e
          if [ -f gradlew ]; then G=./gradlew; else G=gradle; fi
          $G assembleDebug --console=plain --stacktrace > build.log 2>&1
          code=$?
          echo "======== KOTLIN / GRADLE ERRORS ========"
          grep -E "^e: |error:|FAILED|What went wrong" build.log | head -40
          echo "======== END OF ERRORS ========"
          if [ $code -ne 0 ]; then tail -n 60 build.log; fi
          exit $code

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-horizon-debug
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build signed release APK
        if: steps.key.outputs.present == 'true'
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/signing/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: pulsehorizon
          RELEASE_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -f gradlew ]; then G=./gradlew; else G=gradle; fi
          $G assembleRelease --console=plain --stacktrace

      - name: Upload signed release APK
        if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pulse-horizon-release
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
